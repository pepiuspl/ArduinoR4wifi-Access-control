; CTRLABLE Access - firmware panelu zewnetrznego (ESP32-C3 + RS-485/OSDP PD)
;
; Podstawowy sposob pracy to Arduino IDE (otwierasz panel-firmware.ino). Ten plik
; jest dodatkiem dla PlatformIO - buduje DOKLADNIE TE SAME pliki z katalogu szkicu,
; zeby dalo sie kompilowac z linii polecen (np. w CI) bez drugiej kopii kodu.

[platformio]
src_dir = .
[env:panel]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    https://github.com/goToMain/libosdp.git
    miguelbalboa/MFRC522@^1.4.11
    adafruit/Adafruit SH110X@^2.1.11
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
